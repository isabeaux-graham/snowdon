<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yr Wyddfa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐑</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Bricolage+Grotesque:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f3efe2;--ink:#26301f;--line:rgba(38,48,31,.28);--up-dark:#3b779e;--up-light:#d2e3ee;--dn-light:#d2e3ee;--dn-dark:#cb75a9;
 --g1:rgba(255,255,255,.46);--g2:rgba(255,255,255,.16);--g3:rgba(255,255,255,.28);
 --rim:rgba(255,255,255,.95);--rim-lo:rgba(255,255,255,.5);--glow:rgba(255,255,255,.22);--drop:rgba(38,48,31,.30);--shade:rgba(38,48,31,.07);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161c13;--ink:#e6ecd9;--line:rgba(230,236,217,.32);
 --g1:rgba(255,255,255,.17);--g2:rgba(255,255,255,.04);--g3:rgba(255,255,255,.10);--rim:rgba(255,255,255,.55);--rim-lo:rgba(255,255,255,.2);--glow:rgba(255,255,255,.07);--drop:rgba(0,0,0,.5);--shade:rgba(0,0,0,.16)}}
:root[data-theme="dark"]{--bg:#161c13;--ink:#e6ecd9;--line:rgba(230,236,217,.32);
 --g1:rgba(255,255,255,.17);--g2:rgba(255,255,255,.04);--g3:rgba(255,255,255,.10);--rim:rgba(255,255,255,.55);--rim-lo:rgba(255,255,255,.2);--glow:rgba(255,255,255,.07);--drop:rgba(0,0,0,.5);--shade:rgba(0,0,0,.16)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Bricolage Grotesque",system-ui,sans-serif;overflow:hidden}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

/* header: title, subtitle, then free-floating view buttons */
header{position:fixed;left:24px;top:calc(20px + env(safe-area-inset-top,0px));pointer-events:none;max-width:min(420px,80vw)}
h1{font:300 clamp(34px,6vw,64px)/1 Fraunces,Georgia,serif;margin:0 0 8px;letter-spacing:-.01em}
header p{margin:0;opacity:.75}
header .date{display:block;margin-top:2px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;pointer-events:auto}
.seg button{padding:8px 15px;border:1px solid var(--line);border-radius:5px;background:none;color:inherit;font:inherit;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.seg button:hover{border-color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:2px solid #c8283c;outline-offset:2px}

/* cards: same colour as the screen */
.glass{position:relative;border-radius:5px;padding:14px 22px 15px;background:var(--bg);border:1px solid var(--line)}
/* bottom dock: trip totals + hover readout that together span the screen */
#dock{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;pointer-events:none}
#trip{flex:1 1 auto;display:flex;align-items:center}
#trip .stats{flex:1}
#hover{flex:2 1 460px;min-width:0;pointer-events:auto}
.stats{margin:0}
.stats div{position:relative;display:grid;align-content:start}
/* tiny colour key above Time up / Time down: darkest end of each trail colour */
.stats .t-up::before,.stats .t-dn::before{content:"";position:absolute;left:0;top:-7px;width:22px;height:3px;border-radius:99px}
.stats .t-up::before{background:var(--up-dark)}
.stats .t-dn::before{background:var(--dn-dark)}
.stats dt{font-size:11.5px;letter-spacing:.02em;opacity:.68}
.stats dd{margin:0;font-size:19px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats small{font-size:12px;font-weight:400;opacity:.68}
.stats small.n{font-size:11.5px;white-space:nowrap}
#st{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px 28px}
#hd{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.6rem,1fr));gap:8px 18px}
#hover.idle #hd dd{opacity:.35}
/* route scrubber */
#scrub{position:relative;height:54px;margin:6px 8px -4px;touch-action:none;cursor:ew-resize;--p:50%;outline:none;-webkit-tap-highlight-color:transparent}
#scrub:focus-visible{outline:2px solid #c8283c;outline-offset:2px;border-radius:10px}
#bar{position:absolute;left:0;right:0;top:13px;height:6px;margin-top:-3px;border-radius:99px;
 background:linear-gradient(90deg,var(--up-dark) 0,var(--up-light) calc(var(--p) - 2%),var(--dn-light) calc(var(--p) + 2%),var(--dn-dark) 100%);
 box-shadow:inset 0 1px 1px rgba(255,255,255,.55),0 1px 4px rgba(0,0,0,.14)}
#peak{position:absolute;left:var(--p);top:13px;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;border:2.5px solid var(--up-light);box-shadow:0 1px 4px rgba(0,0,0,.25)}
/* labels under the bar: start (left), summit (at the peak), end (right) - name, then elevation */
.tk{position:absolute;top:24px;font-size:11px;line-height:1.35;opacity:.7;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
.tk span{display:block}
#ls{left:0}
#pk{left:var(--p);transform:translateX(-50%);text-align:center}
#le{right:0;text-align:right}
#thumb{position:absolute;top:13px;width:17px;height:17px;margin:-8.5px 0 0 -8.5px;border-radius:50%;background:#fff;border:3px solid var(--up-light);box-shadow:0 2px 8px rgba(0,0,0,.35);opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s;pointer-events:none}
#thumb.on{opacity:1;transform:none}
@media (max-width:760px){
 header{left:16px}
 #dock{gap:8px}
 .glass{border-radius:22px;padding:11px 16px 12px}
 #trip,#hover{flex:1 1 100%}
 #trip{padding-top:16px}
 .stats dd{font-size:17px}
 #st{gap:20px 18px}
}

/* summit marker: a thin pole in the scene plus a label that follows its tip */
#sum{position:fixed;left:0;top:0;pointer-events:none;will-change:transform;transition:opacity .2s}
#sum div{position:absolute;left:0;bottom:3px;transform:translateX(-50%);text-align:center;white-space:nowrap;line-height:1.25;text-shadow:0 0 5px var(--bg),0 0 2px var(--bg)}
#sum b{display:block;font-size:12.5px;font-weight:600}
#sum b::before{content:"";display:inline-block;margin-right:5px;border:4px solid transparent;border-top:0;border-bottom:7px solid currentColor;vertical-align:1px}
#sum span{display:block;font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
body.intro #sum{opacity:0!important}

/* opening page: contours + route, coordinates, title */
#intro{position:fixed;inset:0;z-index:50;background:var(--bg);transition:opacity .7s ease}
#intro.out{opacity:0;pointer-events:none}
#icv{position:absolute;inset:0;width:100%;height:100%}
.coords{position:absolute;left:24px;top:calc(20px + env(safe-area-inset-top,0px));margin:0;font-size:12.5px;line-height:1.5;letter-spacing:.09em;font-variant-numeric:tabular-nums}
.ttl{position:absolute;left:24px;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:0;font:300 clamp(48px,9vw,120px)/.9 Fraunces,Georgia,serif;letter-spacing:-.01em;text-shadow:0 0 12px var(--bg),0 0 5px var(--bg)}
#go{position:absolute;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:10px;padding:11px 20px;border:1px solid var(--ink);border-radius:5px;background:var(--ink);color:var(--bg);font:inherit;font-weight:600;letter-spacing:.02em;cursor:pointer}
#go i{font-style:normal;transition:transform .2s}
#go:hover i{transform:translateX(3px)}
@media (max-width:760px){.coords{left:16px}.ttl{left:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px))}#go{left:16px;right:16px;justify-content:center;padding:13px}}
@media (prefers-reduced-motion:reduce){#intro{transition:none}}
</style></head><body class="intro">

<footer id="dock">

  <dl id="hd" class="stats"></dl>
  <div id="scrub" role="slider" tabindex="0" aria-label="Position along the route" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div><i id="peak"></i><span id="ls" class="tk"></span><span id="pk" class="tk"></span><span id="le" class="tk"></span><i id="thumb"></i></div>
 </section>
</footer>
<div id="sum" aria-hidden="true"></div>

</div>
